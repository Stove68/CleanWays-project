<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanWays</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />
</head>

<body>

<header>
    <h1>🌍 CleanWays</h1>
    <p>Gemeinsam saubere Wege sichtbar machen</p>
</header>

<main>

    <section>
        <h2>Willkommen</h2>
        <p>
            Dokumentiere deine Müllsammelaktionen und mache dein Engagement sichtbar.
        </p>
    </section>

    <div id="controls">
        <button id="startBtn">🟢 Sammelaktion starten</button>
        <button id="stopBtn">🔴 Sammelaktion beenden</button>
    </div>

    <div id="status">
        Bereit für eine Sammelaktion
    </div>

    <div id="stats">
        <h3>Statistik</h3>

        <p id="routeCount">
            Sammelaktionen: 0
        </p>

        <p id="distanceCount">
            Strecke: 0 km
        </p>
    </div>

    <section>
        <h2>Kartenbereich</h2>

        <div id="map"></div>

        <div id="legend">
            <h3>Legende</h3>

            <p>🟢 Gereinigt innerhalb
